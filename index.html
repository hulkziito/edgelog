<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EssentTradingJournal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  signInWithPopup,
  GoogleAuthProvider,
  signOut,
  updateProfile,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  addDoc,
  setDoc,
  deleteDoc,
  onSnapshot,
  query,
  orderBy,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "COLE_AQUI",
  authDomain: "COLE_AQUI",
  projectId: "COLE_AQUI",
  storageBucket: "COLE_AQUI",
  messagingSenderId: "COLE_AQUI",
  appId: "COLE_AQUI"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

setPersistence(auth, browserLocalPersistence);

let currentUser = null;
let trades = [];
let journals = [];
let emoVal = null;
let jEmoVal = null;
let currentView = 'dash';
const charts = {};

/* SUBSCRIPTIONS */
let unsubTrades = null;
let unsubJournal = null;

onAuthStateChanged(auth, user => {
  if (user) {
    currentUser = user;

    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app-screen').style.display  = 'flex';
    document.getElementById('user-name').textContent = user.displayName || user.email;

    subscribeData();
  } else {
    currentUser = null;

    if (unsubTrades) unsubTrades();
    if (unsubJournal) unsubJournal();

    document.getElementById('auth-screen').style.display = 'flex';
    document.getElementById('app-screen').style.display  = 'none';
  }
});

/* SUBSCRIBE FIRESTORE (REAL TIME) */
function subscribeData() {
  const tradesCol = collection(db, 'users', currentUser.uid, 'trades');
  const journalCol = collection(db, 'users', currentUser.uid, 'journal');

  unsubTrades = onSnapshot(
    query(tradesCol, orderBy('date', 'desc')),
    snap => {
      trades = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderAll();
    }
  );

  unsubJournal = onSnapshot(
    query(journalCol, orderBy('date', 'desc')),
    snap => {
      journals = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (currentView === 'journal') renderJournal();
    }
  );
}

/* AUTH */
window.authLogin = async () => {
  const email = document.getElementById('a-email').value;
  const pass  = document.getElementById('a-pass').value;
  await signInWithEmailAndPassword(auth, email, pass);
};

window.authRegister = async () => {
  const email = document.getElementById('a-email').value;
  const pass  = document.getElementById('a-pass').value;
  const name  = document.getElementById('a-name').value;

  const cred = await createUserWithEmailAndPassword(auth, email, pass);
  if (name) await updateProfile(cred.user, { displayName: name });
};

window.authGoogle = async () => {
  await signInWithPopup(auth, new GoogleAuthProvider());
};

window.authLogout = () => signOut(auth);

/* FIRESTORE OPS */
function tradesCol() {
  return collection(db, 'users', currentUser.uid, 'trades');
}

async function fbAddTrade(obj) {
  return await addDoc(tradesCol(), { ...obj, createdAt: serverTimestamp() });
}

async function fbUpdateTrade(id, obj) {
  return await setDoc(doc(db, 'users', currentUser.uid, 'trades', id), obj, { merge: true });
}

async function fbDeleteTrade(id) {
  return await deleteDoc(doc(db, 'users', currentUser.uid, 'trades', id));
}

/* UI HELPERS */
function renderAll() {
  renderStats();
  if (currentView === 'dash') renderDash();
  if (currentView === 'trades') renderTrades();
  if (currentView === 'analytics') renderAnalytics();
  if (currentView === 'journal') renderJournal();
  if (currentView === 'risk') renderRisk();
}

/* NAV */
window.nav = (v, btn) => {
  currentView = v;
  document.querySelectorAll('.nb').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');

  ['dash','trades','analytics','journal','risk'].forEach(id=>{
    document.getElementById('v-'+id).style.display = id===v?'block':'none';
  });

  renderAll();
};

/* JOURNAL SAVE (unchanged logic) */
window.saveJournalEntry = async () => {
  const entry = {
    date: document.getElementById('j-date').value,
    emo: jEmoVal || 3,
    ctx: document.getElementById('j-ctx').value,
    lessons: document.getElementById('j-les').value,
    goals: document.getElementById('j-goal').value,
  };

  await setDoc(
    doc(db, 'users', currentUser.uid, 'journal', entry.date.replace(/-/g,'')),
    { ...entry, updatedAt: serverTimestamp() }
  );
};

/* SAVE TRADE */
window.saveTrade = async () => {
  const sym = document.getElementById('f-sym').value;
  const entry = parseFloat(document.getElementById('f-entry').value);
  const qty = parseFloat(document.getElementById('f-qty').value);
  const exit = parseFloat(document.getElementById('f-exit').value) || null;

  if (!sym || isNaN(entry) || isNaN(qty)) return;

  const dir = document.getElementById('f-dir').value;

  let pnl = null;
  if (exit !== null) {
    pnl = dir === 'long'
      ? (exit - entry) * qty
      : (entry - exit) * qty;
  }

  const obj = {
    sym,
    dir,
    entry,
    exit,
    qty,
    pnl,
    setup: document.getElementById('f-setup').value,
    mkt: document.getElementById('f-mkt').value,
    date: document.getElementById('f-date').value,
    emo: emoVal
  };

  await fbAddTrade(obj);
};

/* SIMPLE STATS */
function renderStats() {
  const el = document.getElementById('stats-row');
  const pnl = trades.reduce((a,t)=>a+(t.pnl||0),0);

  el.innerHTML = `
    <div class="sc"><div class="sc-label">P&L</div><div class="sc-val">${pnl.toFixed(2)}</div></div>
    <div class="sc"><div class="sc-label">Trades</div><div class="sc-val">${trades.length}</div></div>
  `;
}

/* PLACEHOLDERS */
window.renderTrades = () => {};
window.renderDash = () => {};
window.renderAnalytics = () => {};
window.renderJournal = () => {};
window.renderRisk = () => {};

</script>

<style>
body{background:#070c12;color:#fff;font-family:Outfit}
#app-screen{display:none}
</style>

</head>

<body>

<div id="auth-screen">
  <input id="a-name" placeholder="nome">
  <input id="a-email" placeholder="email">
  <input id="a-pass" type="password" placeholder="password">

  <button id="auth-submit-btn" data-action="login" onclick="authLogin()">Entrar</button>
  <button onclick="authRegister()">Criar</button>
  <button onclick="authGoogle()">Google</button>
</div>

<div id="app-screen">
  <div id="stats-row"></div>
</div>

</body>
</html>
